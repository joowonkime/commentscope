name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ingestion:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -c "from pathlib import Path; Path('runs').mkdir(exist_ok=True)"
      - run: python tools/check_mvp_spec.py
      - run: python docs/examples/check_debate_contracts.py
      - name: Check product layout in Chrome at six viewport widths
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/commentscope-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.58.2
          NODE_PATH="$RUNNER_TEMP/commentscope-browser/node_modules" CHROME_BIN="$(command -v google-chrome)" node --test tests/product_layout_smoke.cjs
      - run: python -m unittest discover -s tests -v
      - run: node --check src/commentscope/agents/comparison.js
      - run: node --check src/commentscope/agents/grounded.js
      - run: node --check src/commentscope/product/mvp.js
      - run: node --test tests/web_ui_smoke.cjs tests/grounded_ui_smoke.cjs tests/product_provenance_smoke.cjs
      - run: commentscope validate tests/fixtures/synthetic-snapshot.json
      - run: python -m commentscope normalize tests/fixtures/synthetic-snapshot.json --output artifacts/ci-normalized.json
