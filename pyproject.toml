[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commentscope"
version = "0.1.0"
description = "Research snapshot validation and perspective pipeline foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
commentscope = "commentscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
