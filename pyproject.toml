[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commentscope"
version = "0.1.0"
description = "Research snapshot validation and perspective pipeline foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
clustering = ["sentence-transformers==5.1.1", "transformers==4.57.1", "huggingface-hub==0.35.3", "scikit-learn>=1.6,<2"]

[project.scripts]
commentscope = "commentscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
