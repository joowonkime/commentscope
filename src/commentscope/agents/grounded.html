<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CommentScope 근거 기반 비교</title><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head>
<body class="grounded"><main><h1>CommentScope</h1>
<p>댓글의 관점을 같은 질문으로 비교합니다.</p>
<p class="notice">로컬 개발 화면입니다. 입력 검사를 통과해도 의미 품질이 승인된 에이전트는 아닙니다. 지지 수는 검사한 댓글 중 모델이 지지한다고 판정한 수이며, 영상 전체 여론의 비율이 아닙니다.</p>
<p id="status" role="status">불러오는 중…</p>
<section><h2>비교할 관점 선택</h2><div id="profiles" class="grid"></div><button id="select">선택한 관점으로 새 대화</button></section>
<form id="ask" class="composer"><label for="question">공통 질문 또는 후속 질문</label><textarea id="question" maxlength="1000" required placeholder="이 관점의 핵심 주장과 원문에서 제시한 이유는 무엇인가요?"></textarea>
<button id="submit">두 관점에 질문</button></form>
<section><h2>응답</h2><div id="rounds"></div></section>
<section><h2>원문 확인</h2><p class="hint">댓글 원문 전체입니다. 여기에 적힌 모든 내용이 사실로 검증된 것은 아닙니다.</p><pre id="source">답변 아래 원문 버튼을 누르세요.</pre></section>
<details><summary>생성이 보류된 후보</summary><div id="deferred"></div></details>
</main></body></html>
